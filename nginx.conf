server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: jede URL, die keine echte Datei ist (z.B. /quiz,
    # /profil), bekommt trotzdem index.html - React Router uebernimmt
    # danach im Browser die Weiterleitung zur richtigen Seite.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
